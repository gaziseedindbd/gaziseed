name: Temp COD UX Fix

on:
  push:
    branches:
      - fix/cod-ux-post-next15

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/cod-ux-post-next15

      - name: Apply focused COD UX fixes
        shell: python
        run: |
          from pathlib import Path

          checkout = Path('app/checkout/page.tsx')
          success = Path('app/order-success/page.tsx')

          checkout_text = checkout.read_text()
          replacements = [
              (
                  'router.replace(`/order-success?number=${encodeURIComponent(data.order_number)}&amount=${encodeURIComponent(data.amount ?? data.advance_amount ?? "")}&payment_status=${successStatus}`);',
                  'router.replace(`/order-success?number=${encodeURIComponent(data.order_number)}&amount=${encodeURIComponent(data.amount ?? data.advance_amount ?? "")}&payment_status=${successStatus}&due_amount=${encodeURIComponent(isCodReturn ? data.due_amount ?? "" : "")}`);',
              ),
              (
                  'router.replace(data.order_number ? `/order-success?number=${encodeURIComponent(data.order_number)}` : `/order-success?order_id=${data.order_id}`);',
                  'router.replace(data.order_number ? `/order-success?number=${encodeURIComponent(data.order_number)}&amount=${encodeURIComponent(data.amount ?? data.advance_amount ?? "")}&payment_status=${isCodReturn ? \'cod\' : \'paid\'}&due_amount=${encodeURIComponent(isCodReturn ? data.due_amount ?? "" : "")}` : `/order-success?order_id=${data.order_id}`);',
              ),
              (
                  '<p className="truncate text-lg font-black text-primary">{formatPrice(payableTotal)}</p>',
                  '<p className="truncate text-lg font-black text-primary">{formatPrice(paymentMethod === \'cod\' ? codAdvance : payableTotal)}</p>',
              ),
              (
                  "{country === 'IN' ? 'UPI / Card' : 'COD'}",
                  "{country === 'IN' ? (paymentMethod === 'cod' ? 'COD' : 'UPI / Card') : 'COD'}",
              ),
          ]
          for old, new in replacements:
              count = checkout_text.count(old)
              if count != 1:
                  raise SystemExit(f'checkout replacement mismatch: expected 1, found {count} for {old[:80]!r}')
              checkout_text = checkout_text.replace(old, new)
          checkout.write_text(checkout_text)

          success_text = success.read_text()
          replacements_success = [
              (
                  "  const paymentStatus = searchParams.get('payment_status');\n",
                  "  const paymentStatus = searchParams.get('payment_status');\n  const dueAmount = searchParams.get('due_amount');\n",
              ),
              (
                  "                {(isPaid || isCod) && (\n                  <div className=\"rounded-2xl border border-primary/15 bg-primary/[0.045] p-4 text-left\">\n                    <p className=\"text-xs font-medium uppercase tracking-wider text-muted-foreground\">{t('পেমেন্ট স্ট্যাটাস', 'Payment status')}</p>\n                    <p className=\"mt-1 text-lg font-bold text-primary\">{isCod ? t('COD · আংশিক পরিশোধিত', 'COD · PARTIALLY PAID') : t('পরিশোধিত', 'PAID')}</p>\n                  </div>\n                )}",
                  "                {(isPaid || isCod) && (\n                  <div className=\"rounded-2xl border border-primary/15 bg-primary/[0.045] p-4 text-left\">\n                    <p className=\"text-xs font-medium uppercase tracking-wider text-muted-foreground\">{isCod && dueAmount ? t('ডেলিভারিতে পরিশোধযোগ্য', 'COD due on delivery') : t('পেমেন্ট স্ট্যাটাস', 'Payment status')}</p>\n                    <p className=\"mt-1 text-lg font-bold text-primary\">{isCod && dueAmount ? `₹${Number(dueAmount).toLocaleString('en-IN')}` : (isCod ? t('COD · আংশিক পরিশোধিত', 'COD · PARTIALLY PAID') : t('পরিশোধিত', 'PAID'))}</p>\n                  </div>\n                )}",
              ),
              (
                  "                <p className=\"mt-1 text-sm font-semibold leading-6 text-amber-900/80 dark:text-amber-200/90\">{t('অবশিষ্ট টাকা ডেলিভারির সময় কুরিয়ারকে পরিশোধ করবেন।', 'Please pay the remaining balance to the courier when your order is delivered.')}</p>",
                  "                <p className=\"mt-1 text-sm font-semibold leading-6 text-amber-900/80 dark:text-amber-200/90\">{dueAmount ? t(`ডেলিভারির সময় ₹${Number(dueAmount).toLocaleString('en-IN')} কুরিয়ারকে পরিশোধ করবেন।`, `Please pay ₹${Number(dueAmount).toLocaleString('en-IN')} to the courier when your order is delivered.`) : t('অবশিষ্ট টাকা ডেলিভারির সময় কুরিয়ারকে পরিশোধ করবেন।', 'Please pay the remaining balance to the courier when your order is delivered.')}</p>",
              ),
          ]
          for old, new in replacements_success:
              count = success_text.count(old)
              if count != 1:
                  raise SystemExit(f'order-success replacement mismatch: expected 1, found {count} for {old[:80]!r}')
              success_text = success_text.replace(old, new)
          success.write_text(success_text)

      - name: Commit focused fix and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/temp-cod-ux-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/checkout/page.tsx app/order-success/page.tsx .github/workflows/temp-cod-ux-fix.yml
          git commit -m "fix: align India COD checkout UX"
          git push origin HEAD:fix/cod-ux-post-next15
