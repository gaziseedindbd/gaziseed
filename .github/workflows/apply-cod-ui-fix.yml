name: Apply COD UI fix

on:
  push:
    branches: [fix/india-cod-selector]
  pull_request:
    types: [opened]

permissions:
  contents: write

jobs:
  apply-fix:
    if: ${{ github.event_name == 'pull_request' || !contains(github.event.head_commit.message, '[cod-ui-patch]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/india-cod-selector
          fetch-depth: 0

      - name: Patch checkout UI
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('app/checkout/page.tsx')
          s = p.read_text()

          anchor = '''                <div className="max-h-72 space-y-3 overflow-y-auto border-b border-border/60 p-5 sm:p-6">'''
          if anchor not in s:
              raise SystemExit('COD UI anchor not found')

          if "How would you like to pay?" in s:
              raise SystemExit('COD UI already present')

          block = '''                {country === 'IN' && (\n                  <div className="border-b border-border/60 p-5 sm:p-6">\n                    <div className="mb-3">\n                      <p className="text-[11px] font-black uppercase tracking-[0.16em] text-primary">{t('পেমেন্ট পদ্ধতি', 'Payment method')}</p>\n                      <h3 className="mt-1 text-sm font-black text-foreground">{t('কীভাবে পেমেন্ট করবেন?', 'How would you like to pay?')}</h3>\n                    </div>\n                    <div className="grid gap-3 sm:grid-cols-2">\n                      <button\n                        type="button"\n                        onClick={() => setPaymentMethod('online')}\n                        aria-pressed={paymentMethod === 'online'}\n                        className={`rounded-2xl border-2 p-4 text-left transition-all focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-primary/40 focus-visible:ring-offset-2 ${paymentMethod === 'online' ? 'border-primary bg-primary/5 shadow-sm' : 'border-border bg-background hover:border-primary/30'}`}\n                      >\n                        <span className="flex items-start gap-3">\n                          <span className="mt-0.5 flex h-9 w-9 shrink-0 items-center justify-center rounded-xl bg-primary/10 text-primary"><WalletCards className="h-4 w-4" /></span>\n                          <span className="min-w-0">\n                            <span className="block text-sm font-black">{t('অনলাইন পেমেন্ট', 'Online payment')}</span>\n                            <span className="mt-1 block text-[10px] leading-4 text-muted-foreground">UPI / Card</span>\n                          </span>\n                        </span>\n                      </button>\n\n                      {codAvailable && (\n                        <button\n                          type="button"\n                          onClick={() => setPaymentMethod('cod')}\n                          aria-pressed={paymentMethod === 'cod'}\n                          className={`rounded-2xl border-2 p-4 text-left transition-all focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-primary/40 focus-visible:ring-offset-2 ${paymentMethod === 'cod' ? 'border-primary bg-primary/5 shadow-sm' : 'border-border bg-background hover:border-primary/30'}`}\n                        >\n                          <span className="flex items-start gap-3">\n                            <span className="mt-0.5 flex h-9 w-9 shrink-0 items-center justify-center rounded-xl bg-primary/10 text-primary"><Banknote className="h-4 w-4" /></span>\n                            <span className="min-w-0">\n                              <span className="block text-sm font-black">{t('ক্যাশ অন ডেলিভারি', 'Cash on Delivery')}</span>\n                              <span className="mt-1 block text-[10px] leading-4 text-muted-foreground">{t(`অগ্রিম ${formatPrice(codAdvance)} · ডেলিভারিতে ${formatPrice(codDue)}`, `Advance ${formatPrice(codAdvance)} · ${formatPrice(codDue)} due on delivery`)}</span>\n                            </span>\n                          </span>\n                        </button>\n                      )}\n                    </div>\n                    {!codAvailable && (\n                      <p className="mt-3 rounded-xl border border-amber-200/80 bg-amber-500/10 px-3 py-2 text-[10px] font-bold leading-4 text-amber-700 dark:border-amber-900/60 dark:text-amber-300">\n                        {t('এই অর্ডারের জন্য COD উপলভ্য নয়।', 'COD is not available for this order.')}\n                      </p>\n                    )}\n                  </div>\n                )}\n\n'''

          s = s.replace(anchor, block + anchor, 1)

          old_mobile = '''              {loading ? <Loader2 className="h-4 w-4 animate-spin" /> : <>{country === 'IN' ? t('পেমেন্ট করুন', 'Pay online') : t('অর্ডার করুন', 'Place order')} <ChevronRight className="h-4 w-4" /></>}'''
          new_mobile = '''              {loading ? <Loader2 className="h-4 w-4 animate-spin" /> : <>{country === 'IN' ? (paymentMethod === 'cod' ? t('COD অগ্রিম', 'COD advance') : t('অনলাইন পেমেন্ট', 'Pay online')) : t('অর্ডার করুন', 'Place order')} <ChevronRight className="h-4 w-4" /></>}'''
          if old_mobile not in s:
              raise SystemExit('Mobile submit label anchor not found')
          s = s.replace(old_mobile, new_mobile, 1)

          p.write_text(s)
          PY

      - name: Remove temporary workflow
        run: rm .github/workflows/apply-cod-ui-fix.yml

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/checkout/page.tsx .github/workflows/apply-cod-ui-fix.yml
          git commit -m "fix: restore India COD payment selector [cod-ui-patch]"
          git push origin fix/india-cod-selector
