name: Fix Cashfree return fallback

on:
  push:
    branches: [main]

jobs:
  patch:
    if: github.actor == 'gaziseedindbd'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch checkout return handling
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app/checkout/page.tsx')
          s = p.read_text()
          old = '''  useEffect(() => {\n    const params = new URLSearchParams(window.location.search);\n    if (params.get('cashfree_return') !== '1') return;\n    const cashfreeOrderId = params.get('order_id');\n    if (!cashfreeOrderId) return;\n'''
          new = '''  useEffect(() => {\n    const params = new URLSearchParams(window.location.search);\n    const returnedFromCashfree = params.get('cashfree_return') === '1';\n    const queryOrderId = params.get('order_id');\n    const pendingOrderId = localStorage.getItem('cashfree_pending_order_id');\n    const cashfreeOrderId = queryOrderId || (returnedFromCashfree ? pendingOrderId : null);\n    if (!cashfreeOrderId) return;\n'''
          if old not in s:
              raise SystemExit('return-handling anchor not found')
          s = s.replace(old, new, 1)
          old = '''        if (data?.completed && data?.order_number) {\n          localStorage.removeItem('gazi_cart');\n          window.dispatchEvent(new Event('cart-updated'));\n'''
          new = '''        if (data?.completed && data?.order_number) {\n          localStorage.removeItem('gazi_cart');\n          localStorage.removeItem('cashfree_pending_order_id');\n          window.dispatchEvent(new Event('cart-updated'));\n'''
          if old not in s:
              raise SystemExit('completed anchor not found')
          s = s.replace(old, new, 1)
          old = '''        if (data?.already_completed && data?.order_id) {\n          navigatedToSuccess = true;\n'''
          new = '''        if (data?.already_completed && data?.order_id) {\n          localStorage.removeItem('cashfree_pending_order_id');\n          navigatedToSuccess = true;\n'''
          if old not in s:
              raise SystemExit('already-completed anchor not found')
          s = s.replace(old, new, 1)
          old = '''      if (!data?.ok || !data.payment_session_id || !data.order_id) throw new Error(data?.error || 'Unable to start Cashfree payment');\n\n      await loadCashfreeSdk();\n'''
          new = '''      if (!data?.ok || !data.payment_session_id || !data.order_id) throw new Error(data?.error || 'Unable to start Cashfree payment');\n      localStorage.setItem('cashfree_pending_order_id', data.order_id);\n\n      await loadCashfreeSdk();\n'''
          if old not in s:
              raise SystemExit('payment-session anchor not found')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/checkout/page.tsx
          git diff --cached --quiet && exit 0
          git commit -m 'Fix Cashfree return navigation fallback'
          git push
      - name: Remove temporary workflow
        if: success()
        run: |
          rm -f .github/workflows/fix-cashfree-return-fallback.yml
          git add .github/workflows/fix-cashfree-return-fallback.yml
          git commit -m 'Remove temporary Cashfree return patch workflow'
          git push
