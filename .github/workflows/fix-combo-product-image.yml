name: Fix combo product image fallback

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prefer real product images over placeholder gallery rows
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app/combo/[slug]/page.tsx')
          s = p.read_text()
          old = '''function getProductImage(product: Record<string, any> | null | undefined): string {\n  if (!product) return '';\n\n  const gallery = Array.isArray(product.product_images)\n    ? [...product.product_images]\n        .filter((item: any) => typeof item?.image_url === 'string' && item.image_url.trim())\n        .sort((a: any, b: any) => Number(a.display_order ?? 0) - Number(b.display_order ?? 0))\n        .map((item: any) => item.image_url)\n    : [];\n\n  const candidates = [\n    ...gallery,\n    product.image_url,\n    product.featured_image,\n    product.primary_image,\n    product.image,\n    Array.isArray(product.images) ? product.images[0] : '',\n    Array.isArray(product.gallery) ? product.gallery[0] : '',\n  ];\n\n  return candidates.find((value) => typeof value === 'string' && value.trim())?.trim() || '';\n}\n'''
          new = '''function getProductImage(product: Record<string, any> | null | undefined): string {\n  if (!product) return '';\n\n  const isUsableImage = (value: unknown): value is string => {\n    if (typeof value !== 'string' || !value.trim()) return false;\n    const normalized = value.trim().toLowerCase();\n    return !normalized.includes('placehold.co') && !normalized.includes('placeholder');\n  };\n\n  const gallery = Array.isArray(product.product_images)\n    ? [...product.product_images]\n        .filter((item: any) => isUsableImage(item?.image_url))\n        .sort((a: any, b: any) => Number(a.display_order ?? 0) - Number(b.display_order ?? 0))\n        .map((item: any) => item.image_url.trim())\n    : [];\n\n  const candidates = [\n    ...gallery,\n    product.image_url,\n    product.featured_image,\n    product.primary_image,\n    product.image,\n    Array.isArray(product.images) ? product.images[0] : '',\n    Array.isArray(product.gallery) ? product.gallery[0] : '',\n  ];\n\n  return candidates.find(isUsableImage)?.trim() || '';\n}\n'''
          if old not in s:
              raise SystemExit('Expected getProductImage block was not found')
          p.write_text(s.replace(old, new, 1))
          PY

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/combo/[slug]/page.tsx
          git diff --cached --quiet && exit 0
          git commit -m "fix: prefer real combo product images"
          git push
