name: Apply India COD advance checkout
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  patch:
    if: github.event.head_commit.message != 'Apply India COD advance checkout'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch checkout
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('app/checkout/page.tsx')
          s=p.read_text()
          reps=[
          ("  const [useWallet, setUseWallet] = useState(false);\n", "  const [useWallet, setUseWallet] = useState(false);\n  const [paymentMethod, setPaymentMethod] = useState<'online' | 'cod'>('online');\n"),
          ("  const selectedWalletAmount = walletSummary?.unlocked ? Math.min(walletSummary.max_usable, grandTotal) : 0;\n", "  const selectedWalletAmount = walletSummary?.unlocked ? Math.min(walletSummary.max_usable, grandTotal) : 0;\n  const codAdvance = country === 'IN' ? (deliveryCharge > 0 ? deliveryCharge : 120) : 0;\n  const codAvailable = country !== 'IN' || deliveryCharge > 0 || payableTotal >= 120;\n  const checkoutPayNow = country === 'IN' && paymentMethod === 'cod' ? codAdvance : payableTotal;\n  const checkoutDueOnDelivery = country === 'IN' && paymentMethod === 'cod' ? Math.max(0, payableTotal - codAdvance) : 0;\n"),
          ("  const startCashfreePayment = async (fullAddress: string, items: Array<{ product_id: string; quantity: number; variant_id: string | null; bundle_id: string | null }>, phone: string) => {\n", "  const startCashfreePayment = async (fullAddress: string, items: Array<{ product_id: string; quantity: number; variant_id: string | null; bundle_id: string | null }>, phone: string, method: 'online' | 'cod') => {\n"),
          ("          use_referral_wallet: Boolean(useWallet && walletCredit > 0),\n          return_url: returnUrl,\n", "          use_referral_wallet: Boolean(useWallet && walletCredit > 0),\n          payment_method: method === 'cod' ? 'cod' : 'cashfree',\n          return_url: returnUrl,\n"),
          ("        await startCashfreePayment(fullAddress, items, phone);\n        return;\n", "        await startCashfreePayment(fullAddress, items, phone, paymentMethod);\n        return;\n"),
          ("                  <div className=\"mt-4 inline-flex items-center gap-2 rounded-full bg-emerald-500/10 px-3 py-1.5 text-[11px] font-black text-emerald-700 dark:text-emerald-300\">\n                    <Truck className=\"h-3.5 w-3.5\" /> {deliveryMessage}\n                  </div>\n", "                  <div className=\"mt-4 inline-flex items-center gap-2 rounded-full bg-emerald-500/10 px-3 py-1.5 text-[11px] font-black text-emerald-700 dark:text-emerald-300\">\n                    <Truck className=\"h-3.5 w-3.5\" /> {deliveryMessage}\n                  </div>\n                  {country === 'IN' && (\n                    <div className=\"mt-4 rounded-2xl border border-border/70 bg-background/70 p-3\">\n                      <p className=\"text-[11px] font-black uppercase tracking-[0.14em] text-primary\">{t('পেমেন্ট পদ্ধতি', 'Payment method')}</p>\n                      <div className=\"mt-2 grid grid-cols-2 gap-2\">\n                        <button type=\"button\" onClick={() => setPaymentMethod('online')} className={`rounded-xl border p-3 text-left transition ${paymentMethod === 'online' ? 'border-primary bg-primary/10' : 'border-border bg-background'}`}>\n                          <span className=\"block text-xs font-black\">{t('অনলাইন পেমেন্ট', 'Online payment')}</span>\n                          <span className=\"mt-1 block text-[10px] text-muted-foreground\">{formatPrice(payableTotal)}</span>\n                        </button>\n                        <button type=\"button\" disabled={!codAvailable} onClick={() => setPaymentMethod('cod')} className={`rounded-xl border p-3 text-left transition disabled:cursor-not-allowed disabled:opacity-45 ${paymentMethod === 'cod' ? 'border-primary bg-primary/10' : 'border-border bg-background'}`}>\n                          <span className=\"block text-xs font-black\">{t('ক্যাশ অন ডেলিভারি', 'Cash on Delivery')}</span>\n                          <span className=\"mt-1 block text-[10px] text-muted-foreground\">{codAvailable ? t(`এখন ${formatPrice(codAdvance)} · পরে ${formatPrice(checkoutDueOnDelivery)}`, `Pay ${formatPrice(codAdvance)} now · ${formatPrice(checkoutDueOnDelivery)} on delivery`) : t('ফ্রি ডেলিভারিতে ন্যূনতম ₹১২০', 'Minimum ₹120 for free-delivery COD')}</span>\n                        </button>\n                      </div>\n                      {paymentMethod === 'cod' && codAvailable && <p className=\"mt-2 text-[10px] font-semibold leading-4 text-muted-foreground\">{deliveryCharge > 0 ? t(`COD অর্ডারের ডেলিভারি চার্জ ${formatPrice(codAdvance)} আগে অনলাইনে দিতে হবে।`, `Pay the ${formatPrice(codAdvance)} delivery charge online first for COD.`) : t('ফ্রি ডেলিভারি হওয়ায় COD নিশ্চিত করতে ₹120 অগ্রিম দিতে হবে। বাকি টাকা ডেলিভারির সময়।', 'Free delivery COD requires a ₹120 advance. Pay the remaining amount on delivery.')}</p>}\n                    </div>\n                  )}\n"),
          ("                  <div className=\"flex justify-between gap-4 text-sm\"><span className=\"text-muted-foreground\">{t('ডেলিভারি', 'Delivery')}</span><span className=\"font-bold\">{deliveryCharge === 0 ? t('ফ্রি', 'Free') : formatPrice(deliveryCharge)}</span></div>\n", "                  <div className=\"flex justify-between gap-4 text-sm\"><span className=\"text-muted-foreground\">{t('ডেলিভারি', 'Delivery')}</span><span className=\"font-bold\">{deliveryCharge === 0 ? t('ফ্রি', 'Free') : formatPrice(deliveryCharge)}</span></div>\n                  {country === 'IN' && paymentMethod === 'cod' && <><div className=\"flex justify-between gap-4 text-sm text-primary\"><span>{t('COD অগ্রিম', 'COD advance')}</span><span className=\"font-bold\">{formatPrice(codAdvance)}</span></div><div className=\"flex justify-between gap-4 text-sm\"><span className=\"text-muted-foreground\">{t('ডেলিভারিতে বাকি', 'Due on delivery')}</span><span className=\"font-bold\">{formatPrice(checkoutDueOnDelivery)}</span></div></>}\n"),
          ("                      <span className=\"text-2xl font-black tracking-tight text-primary\">{formatPrice(payableTotal)}</span>\n", "                      <span className=\"text-2xl font-black tracking-tight text-primary\">{formatPrice(paymentMethod === 'cod' && country === 'IN' ? checkoutPayNow : payableTotal)}</span>\n"),
          ("                    {loading ? <Loader2 className=\"h-5 w-5 animate-spin\" /> : <>{country === 'IN' ? t('অনলাইনে পেমেন্ট করুন', 'Pay online') : t('অর্ডার কনফার্ম করুন', 'Confirm order')} <ChevronRight className=\"h-4 w-4\" /></>}\n", "                    {loading ? <Loader2 className=\"h-5 w-5 animate-spin\" /> : <>{country === 'IN' ? (paymentMethod === 'cod' ? t('COD অগ্রিম পরিশোধ করুন', 'Pay COD advance') : t('অনলাইনে পেমেন্ট করুন', 'Pay online')) : t('অর্ডার কনফার্ম করুন', 'Confirm order')} <ChevronRight className=\"h-4 w-4\" /></>}\n"),
          ("              <p className=\"truncate text-lg font-black text-primary\">{formatPrice(payableTotal)}</p>\n", "              <p className=\"truncate text-lg font-black text-primary\">{formatPrice(paymentMethod === 'cod' && country === 'IN' ? checkoutPayNow : payableTotal)}</p>\n"),
          ("              {loading ? <Loader2 className=\"h-4 w-4 animate-spin\" /> : <>{country === 'IN' ? t('পেমেন্ট করুন', 'Pay online') : t('অর্ডার করুন', 'Place order')} <ChevronRight className=\"h-4 w-4\" /></>}\n", "              {loading ? <Loader2 className=\"h-4 w-4 animate-spin\" /> : <>{country === 'IN' ? (paymentMethod === 'cod' ? t('COD অগ্রিম দিন', 'Pay COD advance') : t('পেমেন্ট করুন', 'Pay online')) : t('অর্ডার করুন', 'Place order')} <ChevronRight className=\"h-4 w-4\" /></>}\n"),
          ]
          for old,new in reps:
              if old not in s: raise SystemExit('Expected checkout pattern missing: '+old[:80])
              s=s.replace(old,new,1)
          p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/checkout/page.tsx
          git diff --cached --check
          git commit -m 'Apply India COD advance checkout'
          git push
