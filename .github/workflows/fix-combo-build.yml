name: Fix combo page build

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fix nullable combo access
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app/combo/[slug]/page.tsx')
          s = p.read_text()
          s = s.replace(
              "const tiers = Array.isArray(combo?.tier_pricing) ? combo.tier_pricing : [];",
              "const tiers = Array.isArray(combo?.tier_pricing) ? (combo?.tier_pricing ?? []) : [];",
          )
          s = s.replace(
              "const items: ComboItem[] = Array.isArray(combo?.combo_items) ? combo.combo_items : [];",
              "const items: ComboItem[] = Array.isArray(combo?.combo_items) ? (combo?.combo_items ?? []) : [];",
          )
          p.write_text(s)
          PY

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/combo/[slug]/page.tsx
          git diff --cached --quiet && exit 0
          git commit -m "fix: resolve combo page type error"
          git push
