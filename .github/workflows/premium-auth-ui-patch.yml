name: Premium Auth UI Footer Patch
on:
  push:
    paths:
      - '.github/workflows/premium-auth-ui-patch.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply UI-only GAZI SEED footer polish
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app/login/page.tsx')
          s = p.read_text()
          old = '<div className="neo-mini" aria-hidden="true">G</div><div className="neo-mini" aria-hidden="true">A</div><div className="neo-mini" aria-hidden="true">Z</div><div className="neo-mini" aria-hidden="true">I</div>'
          new = ''.join(f'<div className="neo-mini" aria-hidden="true">{c}</div>' for c in 'GAZISEED')
          if old not in s: raise SystemExit('Login footer pattern not found')
          p.write_text(s.replace(old, new, 1))

          p = Path('app/register/page.tsx')
          s = p.read_text()
          old = '<div className="neo-mini" aria-hidden="true">G</div><div className="neo-mini" aria-hidden="true">f</div><div className="neo-mini" aria-hidden="true">in</div>'
          new = ''.join(f'<div className="neo-mini" aria-hidden="true">{c}</div>' for c in 'GAZISEED')
          if old not in s: raise SystemExit('Register footer pattern not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Validate, remove temporary workflow, and commit
        run: |
          git add app/login/page.tsx app/register/page.tsx
          git diff --cached --check
          git rm .github/workflows/premium-auth-ui-patch.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Polish auth footer branding [skip ci]'
          git push
