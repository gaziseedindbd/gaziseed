name: Fix Cashfree return navigation

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch checkout navigation cleanup
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('app/checkout/page.tsx')
          text = path.read_text()
          old = """    let active = true;\n    setLoading(true);\n    setError('');\n\n    (async () => {\n"""
          new = """    let active = true;\n    let navigatedToSuccess = false;\n    setLoading(true);\n    setError('');\n\n    (async () => {\n"""
          if old not in text:
              raise SystemExit('Target A not found')
          text = text.replace(old, new, 1)
          old = """        if (data?.completed && data?.order_number) {\n          localStorage.removeItem('gazi_cart');\n          window.dispatchEvent(new Event('cart-updated'));\n          router.replace(`/order-success?number=${data.order_number}`);\n          return;\n        }\n        if (data?.already_completed && data?.order_id) {\n          router.replace(`/order-success?order_id=${data.order_id}`);\n          return;\n        }\n"""
          new = """        if (data?.completed && data?.order_number) {\n          localStorage.removeItem('gazi_cart');\n          window.dispatchEvent(new Event('cart-updated'));\n          navigatedToSuccess = true;\n          router.replace(`/order-success?number=${data.order_number}`);\n          return;\n        }\n        if (data?.already_completed && data?.order_id) {\n          navigatedToSuccess = true;\n          router.replace(`/order-success?order_id=${data.order_id}`);\n          return;\n        }\n"""
          if old not in text:
              raise SystemExit('Target B not found')
          text = text.replace(old, new, 1)
          old = """      } finally {\n        if (active) setLoading(false);\n        window.history.replaceState({}, '', '/checkout');\n      }\n"""
          new = """      } finally {\n        if (active) setLoading(false);\n        if (!navigatedToSuccess) {\n          window.history.replaceState({}, '', '/checkout');\n        }\n      }\n"""
          if old not in text:
              raise SystemExit('Target C not found')
          text = text.replace(old, new, 1)
          path.write_text(text)
          PY
          git diff --check
          git diff -- app/checkout/page.tsx
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/checkout/page.tsx .github/workflows/fix-cashfree-return-navigation.yml
          git commit -m "Fix Cashfree success return navigation" --allow-empty=false
          git rm .github/workflows/fix-cashfree-return-navigation.yml
          git commit -m "Remove temporary Cashfree navigation patch workflow"
          git push origin main
