name: Patch Free Delivery Checkout

on:
  push:
    branches:
      - fix/free-delivery-checkout

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply scoped checkout fix
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('app/checkout/page.tsx')
          text = path.read_text()

          old_state = """  const [useWallet, setUseWallet] = useState(false);\n  const [walletLoading, setWalletLoading] = useState(false);\n"""
          new_state = """  const [useWallet, setUseWallet] = useState(false);\n  const [walletLoading, setWalletLoading] = useState(false);\n  const [freeDeliveryProductIds, setFreeDeliveryProductIds] = useState<Set<string>>(new Set());\n"""
          if old_state not in text:
              raise SystemExit('Expected wallet state block not found')
          text = text.replace(old_state, new_state, 1)

          old_effect = """    return () => window.removeEventListener('cart-updated', handler);\n  }, []);\n\n  useEffect(() => {\n    const params = new URLSearchParams(window.location.search);\n"""
          new_effect = """    return () => window.removeEventListener('cart-updated', handler);\n  }, []);\n\n  useEffect(() => {\n    if (country !== 'IN' || cart.length === 0) {\n      setFreeDeliveryProductIds(new Set());\n      return;\n    }\n\n    const productIds = Array.from(new Set(cart.map((item) => item.product_id)));\n    supabase\n      .from('products')\n      .select('id, free_delivery')\n      .in('id', productIds)\n      .then(({ data }) => {\n        const rows = (data || []) as Array<{ id: string; free_delivery: boolean }>;\n        setFreeDeliveryProductIds(new Set(rows.filter((product) => product.free_delivery).map((product) => product.id)));\n      });\n  }, [cart, country]);\n\n  useEffect(() => {\n    const params = new URLSearchParams(window.location.search);\n"""
          if old_effect not in text:
              raise SystemExit('Expected checkout effect boundary not found')
          text = text.replace(old_effect, new_effect, 1)

          old_delivery = """  const deliveryCharge = country === 'IN'\n    ? subtotal >= 999 ? 0 : subtotal >= 499 ? 60 : 90\n    : subtotal >= 600 ? 0 : subtotal >= 400 ? 50 : subtotal >= 200 ? 70 : 120;\n"""
          new_delivery = """  const deliveryCharge = country === 'IN'\n    ? freeDeliveryProductIds.size > 0 ? 0 : subtotal >= 999 ? 0 : subtotal >= 499 ? 60 : 90\n    : subtotal >= 600 ? 0 : subtotal >= 400 ? 50 : subtotal >= 200 ? 70 : 120;\n"""
          if old_delivery not in text:
              raise SystemExit('Expected India delivery calculation not found')
          text = text.replace(old_delivery, new_delivery, 1)

          old_message = """  const deliveryMessage = useMemo(() => {\n    if (country === 'IN') return subtotal >= 999 ? t('ফ্রি ডেলিভারি যোগ হয়েছে', 'Free delivery unlocked') : t('₹৯৯৯+ অর্ডারে ফ্রি ডেলিভারি', 'Free delivery on ₹999+');\n    return subtotal >= 600 ? t('ফ্রি ডেলিভারি যোগ হয়েছে', 'Free delivery unlocked') : t('৳৬০০+ অর্ডারে ফ্রি ডেলিভারি', 'Free delivery on ৳600+');\n  }, [country, subtotal, t]);\n"""
          new_message = """  const deliveryMessage = useMemo(() => {\n    if (country === 'IN') {\n      return freeDeliveryProductIds.size > 0\n        ? t('ফ্রি ডেলিভারি যোগ হয়েছে', 'Free delivery unlocked')\n        : subtotal >= 999 ? t('ফ্রি ডেলিভারি যোগ হয়েছে', 'Free delivery unlocked') : t('₹৯৯৯+ অর্ডারে ফ্রি ডেলিভারি', 'Free delivery on ₹999+');\n    }\n    return subtotal >= 600 ? t('ফ্রি ডেলিভারি যোগ হয়েছে', 'Free delivery unlocked') : t('৳৬০০+ অর্ডারে ফ্রি ডেলিভারি', 'Free delivery on ৳600+');\n  }, [country, subtotal, freeDeliveryProductIds, t]);\n"""
          if old_message not in text:
              raise SystemExit('Expected delivery message block not found')
          text = text.replace(old_message, new_message, 1)

          path.write_text(text)
          Path('.github/workflows/patch-free-delivery-checkout.yml').unlink()
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/checkout/page.tsx .github/workflows/patch-free-delivery-checkout.yml
          git commit -m "Fix India free delivery checkout calculation"
          git push origin HEAD:${GITHUB_REF_NAME}
