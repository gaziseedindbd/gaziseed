name: Patch success amount redirect

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-success-amount.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Patch checkout redirect
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app/checkout/page.tsx')
          s = p.read_text()
          old = 'router.replace(`/order-success?number=${encodeURIComponent(data.order_number)}`);'
          new = 'router.replace(`/order-success?number=${encodeURIComponent(data.order_number)}&amount=${encodeURIComponent(data.amount ?? "")}&payment_status=paid`);'
          if old not in s:
              raise SystemExit('target redirect not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/checkout/page.tsx
          git commit -m 'Show Cashfree amount on success page [skip ci]'
          git push
